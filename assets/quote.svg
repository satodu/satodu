<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="100%" style="background:#0b0c10; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Geist Mono', 'SF Mono', Consolas, monospace; }
    .quote-text { font-family: 'Space Grotesk', 'Inter', -apple-system, sans-serif; font-size: 14px; font-weight: 500; fill: #E6E6E6; letter-spacing: -0.2px; }
    .cross { font-size: 10px; fill: #ffffff; fill-opacity: 0.2; font-family: monospace; }
  </style>

  <rect width="900" height="80" fill="#0b0c10" />
  <rect x="0" y="0" width="900" height="80" fill="#12141a" rx="6" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  
  <!-- Red indicator bar -->
  <rect x="0" y="10" width="4" height="60" rx="2" fill="#FF2E43" />
  
  <text x="25" y="24" class="cross">+</text>
  <text x="875" y="24" class="cross">+</text>
  <text x="25" y="65" class="cross">+</text>
  <text x="875" y="65" class="cross">+</text>

  <g transform="translate(40, 32)">
    <text x="0" y="0" class="mono" font-size="10" fill="#FF2E43" letter-spacing="1.5px">// CORE_PHILOSOPHY</text>
    <text x="0" y="24" class="quote-text">
      "Seamlessly transitioning between high-level technical strategy and precise, low-level codebase execution."
    </text>
  </g>
</svg>
