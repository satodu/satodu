        <text x="50" y="0" fill="#FF2E43">•</text>
        <text x="65" y="0" fill="#FFFFFF">RabbitMQ</text>
        <text x="140" y="0" fill="#FF2E43">•</text>
        <text x="155" y="0" fill="#FFFFFF">PostgreSQL</text>
        <text x="250" y="0" fill="#FF2E43">•</text>
        <text x="265" y="0" fill="#FFFFFF">MySQL</text>
        <text x="320" y="0" fill="#FF2E43">•</text>
        <text x="335" y="0" fill="#FFFFFF">MongoDB</text>
        <text x="405" y="0" fill="#FF2E43">•</text>
        <text x="420" y="0" fill="#FFFFFF">Redis</text>
        <text x="475" y="0" fill="#FF2E43">•</text>
        <text x="490" y="0" fill="#FFFFFF">GitLab CI / Jenkins</text>
      </g>
      <line x1="16" y1="48" x2="820" y2="48" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
