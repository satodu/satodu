      <circle cx="4" cy="4" r="3" fill="#FF2E43" />
      <text x="16" y="8" font-size="12" font-weight="bold" fill="#FF2E43">04. FRONTEND ARCHITECTURE &amp; INTERFACES</text>
      <text x="330" y="8" font-size="10.5" fill="#6D7382">[ Reactive State // Cross-Platform // Desktop GUI ]</text>

      <!-- Tech tags line -->
      <g transform="translate(16, 20)" font-size="11">
        <text x="0" y="0" fill="#FFFFFF">React</text>
        <text x="50" y="0" fill="#FF2E43">•</text>
        <text x="65" y="0" fill="#FFFFFF">Next.js</text>
        <text x="130" y="0" fill="#FF2E43">•</text>
        <text x="145" y="0" fill="#FFFFFF">Vue.js</text>
        <text x="205" y="0" fill="#FF2E43">•</text>
        <text x="220" y="0" fill="#FFFFFF">Nuxt.js</text>
        <text x="290" y="0" fill="#FF2E43">•</text>
