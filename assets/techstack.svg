        <text x="0" y="0" fill="#FFFFFF">PyTorch</text>
        <text x="70" y="0" fill="#FF2E43">•</text>
        <text x="85" y="0" fill="#FFFFFF">TensorFlow</text>
        <text x="175" y="0" fill="#FF2E43">•</text>
        <text x="190" y="0" fill="#FFFFFF">LangChain</text>
        <text x="275" y="0" fill="#FF2E43">•</text>
        <text x="290" y="0" fill="#FFFFFF">Ollama</text>
        <text x="350" y="0" fill="#FF2E43">•</text>
        <text x="365" y="0" fill="#FFFFFF">Hugging Face</text>
        <text x="475" y="0" fill="#FF2E43">•</text>
        <text x="490" y="0" fill="#FFFFFF">Stable Diffusion (Custom Training)</text>
