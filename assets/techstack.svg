        <text x="395" y="0" fill="#FF2E43">•</text>
        <text x="410" y="0" fill="#FFFFFF">Electron</text>
        <text x="485" y="0" fill="#FF2E43">•</text>
        <text x="500" y="0" fill="#FFFFFF">Cordova</text>
        <text x="570" y="0" fill="#FF2E43">•</text>
        <text x="585" y="0" fill="#FFFFFF">Qt6 / PyQt6</text>
      </g>
      <line x1="16" y1="32" x2="820" y2="32" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </g>

