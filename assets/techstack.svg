    <g transform="translate(0, 240)">
      <circle cx="4" cy="4" r="3" fill="#FF2E43" />
      <text x="16" y="8" font-size="12" font-weight="bold" fill="#FF2E43">05. OBSERVABILITY &amp; TOOLING</text>
      <text x="260" y="8" font-size="10.5" fill="#6D7382">[ Metrics // Telemetry // Design Systems ]</text>

      <!-- Tech tags line -->
      <g transform="translate(16, 20)" font-size="11">
        <text x="0" y="0" fill="#FFFFFF">Grafana</text>
        <text x="70" y="0" fill="#FF2E43">•</text>
        <text x="85" y="0" fill="#FFFFFF">Git</text>
        <text x="120" y="0" fill="#FF2E43">•</text>
        <text x="135" y="0" fill="#FFFFFF">Webpack</text>
        <text x="205" y="0" fill="#FF2E43">•</text>
        <text x="220" y="0" fill="#FFFFFF">Gulp / Babel</text>
        <text x="325" y="0" fill="#FF2E43">•</text>
        <text x="340" y="0" fill="#FFFFFF">Figma</text>
        <text x="395" y="0" fill="#FF2E43">•</text>
        <text x="410" y="0" fill="#FFFFFF">Photoshop</text>
        <text x="495" y="0" fill="#FF2E43">•</text>
        <text x="510" y="0" fill="#FFFFFF">Unity</text>
