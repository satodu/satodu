  <!-- Base Status & Palette Bar -->
  <g transform="translate(40, 435)">
    <text x="0" y="0" font-size="10" fill="#FF2E43" font-weight="bold">[ STATUS: ALL_SYSTEMS_OPERATIONAL ]</text>
    <text x="285" y="0" font-size="10" fill="#6D7382">// 15+ YEARS CONTINUOUS ARCHITECTURE</text>

    <!-- Color blocks -->
    <g transform="translate(595, -9)">
      <rect x="0" y="0" width="22" height="10" fill="#0b0c10" stroke="#3D424F" stroke-width="0.5" />
      <rect x="26" y="0" width="22" height="10" fill="#FF2E43" />
      <rect x="52" y="0" width="22" height="10" fill="#E5A93C" />
      <rect x="78" y="0" width="22" height="10" fill="#2AC372" />
      <rect x="104" y="0" width="22" height="10" fill="#3B82F6" />
      <rect x="130" y="0" width="22" height="10" fill="#8B5CF6" />
      <rect x="156" y="0" width="22" height="10" fill="#8E93A0" />
      <rect x="182" y="0" width="22" height="10" fill="#FFFFFF" />
