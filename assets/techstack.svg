<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#0b0c10; font-family: 'JetBrains Mono', 'Geist Mono', 'SF Mono', Consolas, monospace;">
  <defs>
    <!-- Dot Pattern -->
    <pattern id="tech-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.03" />
    </pattern>

    <!-- Top Glow Gradient -->
    <linearGradient id="tech-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <linearGradient id="pill-hover" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E43" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#161924" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="480" fill="#0b0c10" rx="8" />
  <rect width="900" height="480" fill="url(#tech-dots)" rx="8" />

  <!-- Terminal Window Box -->
  <rect x="15" y="15" width="870" height="450" rx="8" fill="#12141c" stroke="url(#tech-stroke)" stroke-width="1" />

  <!-- Terminal Title Bar -->
  <path d="M 15 23 A 8 8 0 0 1 23 15 L 877 15 A 8 8 0 0 1 885 23 L 885 48 L 15 48 Z" fill="#161922" />
  <line x1="15" y1="48" x2="885" y2="48" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="38" cy="31" r="5" fill="#FF2E43" />
  <circle cx="55" cy="31" r="5" fill="#E5A93C" />
  <circle cx="72" cy="31" r="5" fill="#2AC372" />

  <!-- Window Title -->
  <text x="450" y="36" fill="#8E93A0" font-size="12" text-anchor="middle" letter-spacing="0.5px">panda@satodu-workstation: ~ (tech-stack --all)</text>
  <text x="860" y="35" fill="#5A5F6D" font-size="10" text-anchor="end">[ 5 DOMAINS // PROD_READY ]</text>

  <!-- Corner Crosses -->
  <text x="28" y="68" fill="#ffffff" fill-opacity="0.2" font-size="11">+</text>
  <text x="862" y="68" fill="#ffffff" fill-opacity="0.2" font-size="11">+</text>
  <text x="28" y="450" fill="#ffffff" fill-opacity="0.2" font-size="11">+</text>
  <text x="862" y="450" fill="#ffffff" fill-opacity="0.2" font-size="11">+</text>

  <!-- Main Terminal Prompt Header -->
  <g transform="translate(40, 78)">
    <text x="0" y="0" font-size="14" font-weight="bold">
      <tspan fill="#FF2E43">panda</tspan><tspan fill="#8E93A0">@</tspan><tspan fill="#FFFFFF">satodu</tspan><tspan fill="#7A8191">:~$</tspan> <tspan fill="#EDEDED">cat ~/.config/stack/matrix.spec</tspan>
    </text>
    <line x1="0" y1="12" x2="820" y2="12" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  </g>

  <!-- ==================== TECH SECTIONS ==================== -->
  <g transform="translate(40, 110)">
    <!-- SECTION 01: BACKEND -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="4" r="3" fill="#FF2E43" />
      <text x="16" y="8" font-size="12" font-weight="bold" fill="#FF2E43">01. BACKEND &amp; DISTRIBUTED SYSTEMS</text>
      <text x="290" y="8" font-size="10.5" fill="#6D7382">[ Microservices // High Availability // Queues ]</text>
      
      <!-- Tech tags line -->
      <g transform="translate(16, 20)" font-size="11">
        <text x="0" y="0" fill="#FFFFFF">Node.js (NestJS)</text>
        <text x="130" y="0" fill="#FF2E43">•</text>
        <text x="145" y="0" fill="#FFFFFF">Python (FastAPI, Django)</text>
        <text x="340" y="0" fill="#FF2E43">•</text>
        <text x="355" y="0" fill="#FFFFFF">PHP (Laravel)</text>
        <text x="465" y="0" fill="#FF2E43">•</text>
        <text x="480" y="0" fill="#FFFFFF">Rust</text>
        <text x="525" y="0" fill="#FF2E43">•</text>
        <text x="540" y="0" fill="#FFFFFF">C</text>
        <text x="565" y="0" fill="#FF2E43">•</text>
        <text x="580" y="0" fill="#A8ADB8">Distributed Queues</text>
